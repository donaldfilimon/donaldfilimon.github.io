<!DOCTYPE html>

<html lang="en" class="scroll-smooth">
<head>
  <!-- //! Performance-Critical Meta Configuration -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0052cc">
  <meta name="color-scheme" content="light dark">

  <!-- //! SEO & Social Media Optimization -->

  <title>Donald Filimon - Software Engineer & AI Specialist</title>
  <meta name="description" content="Innovative Software Engineer & AI Specialist with expertise in Swift, LLVM, Machine Learning, and Compiler Optimization. Apple Inc. developer specializing in performance optimization and ethical AI.">
  <meta name="keywords" content="Donald Filimon, Software Engineer, AI Specialist, Swift, LLVM, Machine Learning, Apple, Compiler Optimization, Privacy-First AI, React Developer">
  <meta name="author" content="Donald Filimon">

  <!-- //! Open Graph Protocol - Social Media Integration -->

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://underswitchx.github.io/">
  <meta property="og:title" content="Donald Filimon - Software Engineer & AI Specialist">
  <meta property="og:description" content="Innovative Software Engineer & AI Specialist with expertise in Swift, LLVM, Machine Learning, and Compiler Optimization.">
  <meta property="og:image" content="https://underswitchx.github.io/assets/profile-og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- //! Twitter Card Optimization -->

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@mrunderswitch">
  <meta name="twitter:creator" content="@mrunderswitch">
  <meta name="twitter:title" content="Donald Filimon - Software Engineer & AI Specialist">
  <meta name="twitter:description" content="Innovative Software Engineer & AI Specialist with expertise in Swift, LLVM, Machine Learning, and Compiler Optimization.">
  <meta name="twitter:image" content="https://underswitchx.github.io/assets/profile-twitter.jpg">

  <!-- //! Performance Optimization - Preload Critical Resources -->

  <link rel="preload" href="./styles.css" as="style">
  <link rel="preload" href="./main.js" as="script">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- //! Modern CSS Architecture -->

  <link rel="stylesheet" href="./styles.css">

  <!-- //! Progressive Web App Manifest -->

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png">

  <!-- //! Structured Data - Schema.org JSON-LD -->

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Donald Filimon",
    "jobTitle": "Software Engineer & AI Specialist",
    "description": "Innovative Software Engineer & AI Specialist with expertise in Swift, LLVM, Machine Learning, and Compiler Optimization.",
    "url": "https://underswitchx.github.io/",
    "email": "cbkshadow@gmail.com",
    "telephone": "+1-813-203-0312",
    "worksFor": {
      "@type": "Organization",
      "name": "Apple Inc.",
      "url": "https://apple.com"
    },
    "alumniOf": {
      "@type": "EducationalOrganization",
      "name": "University of Florida",
      "url": "https://ufl.edu"
    },
    "knowsAbout": [
      "Swift Programming",
      "LLVM Compiler Infrastructure", 
      "Machine Learning",
      "Artificial Intelligence",
      "Compiler Optimization",
      "Privacy-Preserving AI",
      "High-Performance Computing"
    ],
    "sameAs": [
      "https://linkedin.com/in/donaldfilimon",
      "https://github.com/underswitchx",
      "https://x.com/mrunderswitch"
    ],
    "image": "https://underswitchx.github.io/assets/profile.jpg"
  }
  </script>

  <!-- //! Modern Font Loading Strategy -->

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- //! Critical CSS Inlining for Above-Fold Content -->

  <style>
    /* //! Zero-Layout-Shift Loading State */
    .loading-skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading-shimmer 1.5s infinite;
    }
    
    @keyframes loading-shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    
    /* //! Hardware-Accelerated Transitions */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    
    body {
      background-color: #ffffff;
      color: #1e293b;
      transition: background-color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    [data-theme="dark"] body {
      background-color: #0f172a;
      color: #f1f5f9;
    }
  </style>

</head>
<body>
  <!-- //! Accessibility-First Navigation -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- //! React Application Mount Point -->

  <div id="root" class="min-h-screen">
    <!-- //! Progressive Loading State -->
    <div class="loading-state">
      <div class="loading-skeleton h-screen"></div>
    </div>
  </div>

  <!-- //! Error Boundary Fallback -->

  <div id="error-fallback" class="hidden error-boundary">
    <div class="error-container">
      <h1>Something went wrong</h1>
      <p>Please refresh the page or try again later.</p>
      <button onclick="location.reload()" class="retry-button">
        Reload Page
      </button>
    </div>
  </div>

  <!-- //! Modern JavaScript Module Loading -->

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- //! Application Bootstrap -->

  <script src="./main.js" type="module" defer></script>

  <!-- //! Service Worker Registration -->

  <script>
    //! Progressive Web App Initialization
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => console.log('SW registered'))
          .catch(error => console.log('SW registration failed'));
      });
    }
    
    //! Performance Monitoring
    window.addEventListener('load', () => {
      if ('performance' in window) {
        const perfData = performance.getEntriesByType('navigation')[0];
        console.log(`Page loaded in ${perfData.loadEventEnd - perfData.loadEventStart}ms`);
      }
    });
  </script>

</body>
</html>
