name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard published docs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("docs/index.html").read_text(encoding="utf-8")
          cname = Path("docs/CNAME").read_text(encoding="utf-8").strip()
          assert "location.replace" not in html
          assert "star-space-portfolio" not in html
          assert "Star Space" not in html
          assert "Donald Filimon" in html
          assert 'id="work"' in html
          assert cname == "donaldfilimon.com"
          print("docs guard ok")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
